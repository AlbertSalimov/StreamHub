name: StreamHub CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and build Go
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: streamhub_test
          POSTGRES_USER: streamhub
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U streamhub -d streamhub_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: |
          files="$(gofmt -l cmd internal)"
          if [ -n "$files" ]; then
            echo "These Go files need gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Unit and package tests
        run: go test ./...

      - name: PostgreSQL integration tests
        env:
          TEST_DATABASE_URL: postgres://streamhub:test_password@localhost:5432/streamhub_test?sslmode=disable
        run: go test ./internal/content -run TestRepositoryIntegration -v

      - name: Race detector
        run: go test -race ./...

      - name: Build API
        run: go build -o /tmp/streamhub ./cmd/api

      - name: Build Docker image
        run: docker build -t streamhub:ci .
