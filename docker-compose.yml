services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: streamhub
      POSTGRES_USER: streamhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U streamhub -d streamhub" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: [ "redis-server", "--save", "", "--appendonly", "no" ]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nats:
    image: nats:2-alpine
    command: [ "-js", "-m", "8222" ]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    restart: unless-stopped

  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_DB: streamhub_test
      POSTGRES_USER: streamhub
      POSTGRES_PASSWORD: test_password
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U streamhub -d streamhub_test" ]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles:
      - test

volumes:
  postgres_data:
